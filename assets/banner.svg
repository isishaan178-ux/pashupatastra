<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0a0a1a"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="50%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="50%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="tier-s" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#064e3b"/>
    </linearGradient>
    <linearGradient id="tier-m" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="tier-l" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#4a1d6a"/>
    </linearGradient>
    <linearGradient id="tier-xl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#7f1d1d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.05" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Top gradient line -->
  <rect x="100" y="30" width="1000" height="3" rx="2" fill="url(#line-grad)" filter="url(#glow)"/>

  <!-- Title -->
  <text x="600" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="url(#title-grad)" filter="url(#glow)">PASHUPATASTRA</text>

  <!-- Subtitle -->
  <text x="600" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#888" letter-spacing="4">LORD SHIVA'S UNSTOPPABLE CELESTIAL WEAPON FOR CLAUDE CODE</text>

  <!-- Tagline -->
  <text x="600" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#ccc">The adaptive multi-agent orchestrator that gives your AI a full org chart.</text>

  <!-- Divider -->
  <rect x="450" y="205" width="300" height="1" fill="#333"/>

  <!-- Pipeline Flow -->
  <!-- Connection line -->
  <line x1="140" y1="270" x2="1060" y2="270" stroke="#222" stroke-width="2"/>
  <line x1="140" y1="270" x2="1060" y2="270" stroke="url(#line-grad)" stroke-width="2" opacity="0.4"/>

  <!-- Triage -->
  <circle cx="140" cy="270" r="28" fill="#1a1a2e" stroke="#f97316" stroke-width="2"/>
  <text x="140" y="265" text-anchor="middle" font-size="20">&#9889;</text>
  <text x="140" y="280" text-anchor="middle" font-family="Arial" font-size="9" fill="#f97316">TRIAGE</text>
  <text x="140" y="315" text-anchor="middle" font-family="Arial" font-size="11" fill="#666">~50 tokens</text>

  <!-- Tier boxes under triage -->
  <rect x="220" y="248" width="50" height="44" rx="6" fill="url(#tier-s)" opacity="0.8"/>
  <text x="245" y="275" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#fff">S</text>
  <text x="245" y="315" text-anchor="middle" font-family="Arial" font-size="9" fill="#10b981">Just do it</text>

  <rect x="280" y="248" width="50" height="44" rx="6" fill="url(#tier-m)" opacity="0.8"/>
  <text x="305" y="275" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#fff">M</text>
  <text x="305" y="315" text-anchor="middle" font-family="Arial" font-size="9" fill="#3b82f6">1 Worker</text>

  <rect x="340" y="248" width="50" height="44" rx="6" fill="url(#tier-l)" opacity="0.8"/>
  <text x="365" y="275" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#fff">L</text>
  <text x="365" y="315" text-anchor="middle" font-family="Arial" font-size="9" fill="#a855f7">Team</text>

  <rect x="400" y="248" width="50" height="44" rx="6" fill="url(#tier-xl)" opacity="0.8"/>
  <text x="425" y="275" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#fff">XL</text>
  <text x="425" y="315" text-anchor="middle" font-family="Arial" font-size="9" fill="#ef4444">Full Org</text>

  <!-- Plan -->
  <circle cx="530" cy="270" r="28" fill="#1a1a2e" stroke="#eab308" stroke-width="2"/>
  <text x="530" y="275" text-anchor="middle" font-size="22">&#128203;</text>
  <text x="530" y="315" text-anchor="middle" font-family="Arial" font-size="11" fill="#eab308">Plan</text>

  <!-- Challenge -->
  <circle cx="680" cy="270" r="28" fill="#1a1a2e" stroke="#22c55e" stroke-width="2"/>
  <text x="680" y="275" text-anchor="middle" font-size="22">&#9876;</text>
  <text x="680" y="315" text-anchor="middle" font-family="Arial" font-size="11" fill="#22c55e">Challenge</text>

  <!-- 3 mini circles for challengers -->
  <circle cx="660" cy="235" r="8" fill="#dc2626" opacity="0.7"/>
  <circle cx="680" cy="228" r="8" fill="#16a34a" opacity="0.7"/>
  <circle cx="700" cy="235" r="8" fill="#2563eb" opacity="0.7"/>

  <!-- Execute -->
  <circle cx="840" cy="270" r="28" fill="#1a1a2e" stroke="#3b82f6" stroke-width="2"/>
  <text x="840" y="275" text-anchor="middle" font-size="22">&#127959;</text>
  <text x="840" y="315" text-anchor="middle" font-family="Arial" font-size="11" fill="#3b82f6">Execute</text>

  <!-- Hierarchy mini-viz -->
  <rect x="810" y="225" width="16" height="12" rx="2" fill="#ef4444" opacity="0.6"/>
  <rect x="830" y="225" width="16" height="12" rx="2" fill="#a855f7" opacity="0.6"/>
  <rect x="850" y="225" width="16" height="12" rx="2" fill="#a855f7" opacity="0.6"/>
  <line x1="818" y1="237" x2="838" y2="225" stroke="#444" stroke-width="1"/>
  <line x1="858" y1="237" x2="838" y2="225" stroke="#444" stroke-width="1"/>

  <!-- Review -->
  <circle cx="1000" cy="270" r="28" fill="#1a1a2e" stroke="#a855f7" stroke-width="2"/>
  <text x="1000" y="275" text-anchor="middle" font-size="22">&#128269;</text>
  <text x="1000" y="315" text-anchor="middle" font-family="Arial" font-size="11" fill="#a855f7">Review</text>

  <!-- Approval gate markers -->
  <g fill="#eab308" opacity="0.6">
    <rect x="478" y="262" width="4" height="16" rx="1"/>
    <rect x="603" y="262" width="4" height="16" rx="1"/>
    <rect x="758" y="262" width="4" height="16" rx="1"/>
    <rect x="918" y="262" width="4" height="16" rx="1"/>
  </g>
  <text x="600" y="360" text-anchor="middle" font-family="Arial" font-size="10" fill="#eab308" opacity="0.5">|  Approval gates between every phase  |</text>

  <!-- Bottom gradient line -->
  <rect x="100" y="375" width="1000" height="3" rx="2" fill="url(#line-grad)" filter="url(#glow)"/>

  <!-- Bottom stats -->
  <text x="200" y="395" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">9 Specialized Agents</text>
  <text x="450" y="395" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">4 Complexity Tiers</text>
  <text x="700" y="395" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Parallel Execution</text>
  <text x="950" y="395" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Token Optimized</text>
</svg>